name: SSS Nightly Scan

on:
  schedule:
    # 22:30 UTC Mon-Fri = 6:30pm ET during EDT, 5:30pm ET during EST.
    - cron: "0 9 * * 2-6"

  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Days of history to backfill. Leave as 0 for a normal nightly run. Use 120 for a one-time six-month backfill (takes ~30 min)."
        required: false
        default: "0"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests

      - name: Run scan
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          BACKFILL_DAYS: ${{ github.event.inputs.backfill_days || '0' }}
        run: python sss_scan.py

      - name: Commit results
        run: |
          git config user.name "scan-bot"
          git config user.email "scan-bot@users.noreply.github.com"
          git add output/
          git diff --staged --quiet || git commit -m "scan $(date -u +%Y-%m-%d)"
          git push
