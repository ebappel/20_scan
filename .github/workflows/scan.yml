name: SSS Nightly Scan

on:
  schedule:
    # 22:30 UTC Mon-Fri = 6:30pm ET during EDT, 5:30pm ET during EST.
    # Both are comfortably after the 4pm close.
    - cron: "30 22 * * 1-5"
  workflow_dispatch:   # lets you trigger a run manually to test

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests

      - name: Run scan
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python sss_scan.py

      - name: Commit results
        run: |
          git config user.name "scan-bot"
          git config user.email "scan-bot@users.noreply.github.com"
          git add output/
          git diff --staged --quiet || git commit -m "scan $(date -u +%Y-%m-%d)"
          git push
