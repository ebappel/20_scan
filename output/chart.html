<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SSS Breadth — 5 Day 20% Movers</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #000;
    --pane: #0a0a0a;
    --grid: #1c1c1c;
    --edge: #262626;
    --text: #d8d8d8;
    --dim: #6f6f6f;
    --up: #22c55e;
    --down: #ef4444;
    --price: #e8e8e8;
    --accent: #38bdf8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  header {
    display: flex;
    align-items: baseline;
    gap: 18px;
    flex-wrap: wrap;
    padding: 10px 14px;
    border-bottom: 1px solid var(--edge);
  }
  h1 {
    margin: 0;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: .04em;
    color: var(--accent);
  }
  .stat { color: var(--dim); }
  .stat b { color: var(--text); font-weight: 600; }
  .stat.up b { color: var(--up); }
  .stat.down b { color: var(--down); }
  .panes { padding: 6px 0 0; }
  .pane {
    position: relative;
    border-bottom: 1px solid var(--edge);
    background: var(--pane);
    padding: 4px 8px 6px;
  }
  .pane-label {
    position: absolute;
    top: 6px;
    left: 14px;
    z-index: 2;
    font-size: 11px;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--dim);
    pointer-events: none;
  }
  .pane.price { height: 340px; }
  .pane.hist  { height: 170px; }
  .pane canvas { width: 100% !important; height: 100% !important; }
  footer {
    display: flex;
    gap: 6px;
    align-items: center;
    padding: 10px 14px 24px;
    color: var(--dim);
    font-size: 12px;
  }
  button {
    background: transparent;
    color: var(--dim);
    border: 1px solid var(--edge);
    border-radius: 2px;
    padding: 4px 10px;
    font: inherit;
    font-size: 11px;
    cursor: pointer;
  }
  button:hover { color: var(--text); border-color: #3a3a3a; }
  button[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .spacer { flex: 1; }
  #msg { padding: 40px 14px; color: var(--dim); }
</style>
</head>
<body>

<header>
  <h1>SSS BREADTH</h1>
  <span class="stat">5-day 20% movers &middot; US common + ADR &middot; &ge;$5 &middot; min vol 100K</span>
  <span class="spacer"></span>
  <span class="stat">AS OF <b id="s-date">—</b></span>
  <span class="stat">SPY <b id="s-spy">—</b></span>
  <span class="stat up">UP <b id="s-up">—</b></span>
  <span class="stat down">DOWN <b id="s-down">—</b></span>
  <span class="stat">NET <b id="s-net">—</b></span>
</header>

<div id="msg">Loading history…</div>

<div class="panes" id="panes" hidden>
  <div class="pane price"><span class="pane-label">SPY daily close</span><canvas id="c-spy"></canvas></div>
  <div class="pane hist"><span class="pane-label">Stocks up 20% in 5 days</span><canvas id="c-up"></canvas></div>
  <div class="pane hist"><span class="pane-label">Stocks down 20% in 5 days</span><canvas id="c-down"></canvas></div>
</div>

<footer id="controls" hidden>
  <span>RANGE</span>
  <button data-days="63">3M</button>
  <button data-days="126">6M</button>
  <button data-days="252">1Y</button>
  <button data-days="0" aria-pressed="true">ALL</button>
  <span class="spacer"></span>
  <span id="s-sessions"></span>
</footer>

<script>
const CSS = getComputedStyle(document.documentElement);
const col = n => CSS.getPropertyValue(n).trim();

let ALL = [];
let charts = [];

function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  const head = lines[0].split(',');
  return lines.slice(1).map(line => {
    const cells = line.split(',');
    const row = {};
    head.forEach((h, i) => row[h] = cells[i]);
    return {
      date: row.as_of,
      spy: row.spy_close ? parseFloat(row.spy_close) : null,
      up: parseInt(row.up_count, 10) || 0,
      down: parseInt(row.down_count, 10) || 0,
      net: parseInt(row.net, 10) || 0,
    };
  }).filter(r => r.date);
}

// Shared axis config so the three panes line up column for column.
function xAxis(labels, showTicks) {
  return {
    type: 'category',
    labels,
    grid: { color: col('--grid'), drawTicks: false },
    border: { color: col('--edge') },
    ticks: {
      display: showTicks,
      color: col('--dim'),
      font: { family: 'ui-monospace, monospace', size: 10 },
      maxRotation: 0,
      autoSkipPadding: 40,
      callback(v) {
        const d = this.getLabelForValue(v);
        return d ? d.slice(5) : '';
      },
    },
  };
}

function yAxis(opts = {}) {
  return Object.assign({
    position: 'right',
    grid: { color: col('--grid'), drawTicks: false },
    border: { display: false },
    ticks: {
      color: col('--dim'),
      font: { family: 'ui-monospace, monospace', size: 10 },
      maxTicksLimit: 6,
      padding: 6,
    },
  }, opts);
}

const baseOpts = {
  responsive: true,
  maintainAspectRatio: false,
  animation: false,
  interaction: { mode: 'index', intersect: false },
  plugins: {
    legend: { display: false },
    tooltip: {
      backgroundColor: '#111',
      borderColor: col('--edge'),
      borderWidth: 1,
      titleColor: col('--text'),
      bodyColor: col('--text'),
      titleFont: { family: 'ui-monospace, monospace', size: 11 },
      bodyFont: { family: 'ui-monospace, monospace', size: 11 },
      displayColors: false,
      padding: 8,
    },
  },
};

function render(rows) {
  charts.forEach(c => c.destroy());
  charts = [];

  const labels = rows.map(r => r.date);

  charts.push(new Chart(document.getElementById('c-spy'), {
    type: 'line',
    data: {
      labels,
      datasets: [{
        data: rows.map(r => r.spy),
        borderColor: col('--price'),
        borderWidth: 1.4,
        pointRadius: 0,
        tension: 0,
        spanGaps: true,
      }],
    },
    options: {
      ...baseOpts,
      layout: { padding: { top: 22 } },
      scales: {
        x: xAxis(labels, false),
        y: yAxis({ ticks: {
          color: col('--dim'),
          font: { family: 'ui-monospace, monospace', size: 10 },
          maxTicksLimit: 6,
          padding: 6,
          callback: v => v.toFixed(0),
        } }),
      },
      plugins: {
        ...baseOpts.plugins,
        tooltip: {
          ...baseOpts.plugins.tooltip,
          callbacks: { label: c => 'SPY  ' + (c.parsed.y ?? '—') },
        },
      },
    },
  }));

  const hist = (canvasId, key, color, label) =>
    new Chart(document.getElementById(canvasId), {
      type: 'bar',
      data: {
        labels,
        datasets: [{
          data: rows.map(r => r[key]),
          backgroundColor: color,
          borderWidth: 0,
          barPercentage: 1,
          categoryPercentage: 0.86,
        }],
      },
      options: {
        ...baseOpts,
        layout: { padding: { top: 22 } },
        scales: {
          x: xAxis(labels, canvasId === 'c-down'),
          y: yAxis({ beginAtZero: true }),
        },
        plugins: {
          ...baseOpts.plugins,
          tooltip: {
            ...baseOpts.plugins.tooltip,
            callbacks: { label: c => label + '  ' + c.parsed.y },
          },
        },
      },
    });

  charts.push(hist('c-up', 'up', col('--up'), 'UP'));
  charts.push(hist('c-down', 'down', col('--down'), 'DOWN'));

  const last = rows[rows.length - 1];
  document.getElementById('s-date').textContent = last.date;
  document.getElementById('s-spy').textContent = last.spy ?? '—';
  document.getElementById('s-up').textContent = last.up;
  document.getElementById('s-down').textContent = last.down;
  document.getElementById('s-net').textContent =
    (last.net > 0 ? '+' : '') + last.net;
  document.getElementById('s-sessions').textContent =
    rows.length + ' SESSIONS';
}

function applyRange(days) {
  render(days > 0 ? ALL.slice(-days) : ALL);
}

document.getElementById('controls').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  document.querySelectorAll('#controls button')
    .forEach(b => b.setAttribute('aria-pressed', b === btn));
  applyRange(parseInt(btn.dataset.days, 10));
});

fetch('history.csv?t=' + Date.now())
  .then(r => {
    if (!r.ok) throw new Error('history.csv returned ' + r.status);
    return r.text();
  })
  .then(text => {
    ALL = parseCSV(text);
    if (!ALL.length) throw new Error('history.csv has no data rows yet');
    document.getElementById('msg').hidden = true;
    document.getElementById('panes').hidden = false;
    document.getElementById('controls').hidden = false;
    applyRange(0);
  })
  .catch(err => {
    document.getElementById('msg').textContent =
      'Could not load history.csv — ' + err.message +
      '. Make sure this page sits in the same folder as history.csv.';
  });
</script>
</body>
</html>
