<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SSS Breadth — 5 Day 20% Movers</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root {
    --bg: #0b0b0d;
    --pane: #0b0b0d;
    --grid: #1a1a1e;
    --edge: #26262c;
    --text: #dcdce0;
    --dim: #70707a;
    --up: #26a65b;
    --down: #e04c4c;
    --accent: #38bdf8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    display: flex;
    flex-direction: column;
    overflow: hidden;              /* page never scrolls; panes fill it */
  }

  header {
    flex: none;
    display: flex;
    align-items: baseline;
    gap: 18px;
    flex-wrap: wrap;
    padding: 9px 14px;
    border-bottom: 1px solid var(--edge);
  }
  h1 {
    margin: 0; font-size: 14px; font-weight: 600;
    letter-spacing: .04em; color: var(--accent);
  }
  .stat { color: var(--dim); white-space: nowrap; }
  .stat b { color: var(--text); font-weight: 600; }
  .stat.up b { color: var(--up); }
  .stat.down b { color: var(--down); }
  .spacer { flex: 1; }

  /* flex-basis:0 + flex-grow means grow values ARE the pixel heights,
     and the three panes always exactly fill the space. No dead zone. */
  #panes { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .pane {
    position: relative;
    flex-grow: 340;
    flex-basis: 0;
    min-height: 60px;
    background: var(--pane);
    overflow: hidden;
  }
  #p-up, #p-down { flex-grow: 150; }
  .pane-label {
    position: absolute; top: 5px; left: 12px; z-index: 3;
    font-size: 10px; letter-spacing: .07em; text-transform: uppercase;
    color: var(--dim); pointer-events: none;
    text-shadow: 0 0 6px var(--bg), 0 0 6px var(--bg);
  }
  .chart-host { position: absolute; inset: 0; }

  .grip {
    flex: none; height: 6px; cursor: ns-resize; position: relative;
    background: var(--bg);
    border-top: 1px solid var(--edge);
    border-bottom: 1px solid var(--edge);
  }
  .grip::after {
    content: ""; position: absolute; left: 50%; top: 50%;
    width: 30px; height: 1px; transform: translate(-50%, -50%);
    background: #3a3a42;
  }
  .grip:hover::after, .grip.active::after { background: var(--accent); }
  body.resizing { cursor: ns-resize; user-select: none; }

  footer {
    flex: none;
    display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
    padding: 7px 14px;
    border-top: 1px solid var(--edge);
    color: var(--dim); font-size: 12px;
  }
  button {
    background: transparent; color: var(--dim);
    border: 1px solid var(--edge); border-radius: 2px;
    padding: 3px 10px; font: inherit; font-size: 11px; cursor: pointer;
  }
  button:hover { color: var(--text); border-color: #3d3d46; }
  button[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #msg { padding: 40px 14px; color: var(--dim); }
</style>
</head>
<body>

<header>
  <h1>SSS BREADTH</h1>
  <span class="stat">5-day 20% movers &middot; US common + ADR &middot; &ge;$5 &middot; min vol 100K</span>
  <span class="spacer"></span>
  <span class="stat">AS OF <b id="s-date">—</b></span>
  <span class="stat">SPY <b id="s-spy">—</b></span>
  <span class="stat up">UP <b id="s-up">—</b></span>
  <span class="stat down">DOWN <b id="s-down">—</b></span>
  <span class="stat">NET <b id="s-net">—</b></span>
</header>

<div id="msg">Loading history…</div>

<div id="panes" hidden>
  <div class="pane" id="p-spy">
    <span class="pane-label">SPY daily</span>
    <div class="chart-host" id="h-spy"></div>
  </div>
  <div class="grip" data-above="p-spy" data-below="p-up"></div>
  <div class="pane" id="p-up">
    <span class="pane-label">Up 20% in 5 days</span>
    <div class="chart-host" id="h-up"></div>
  </div>
  <div class="grip" data-above="p-up" data-below="p-down"></div>
  <div class="pane" id="p-down">
    <span class="pane-label">Down 20% in 5 days</span>
    <div class="chart-host" id="h-down"></div>
  </div>
</div>

<footer id="controls" hidden>
  <span>RANGE</span>
  <button data-days="63">3M</button>
  <button data-days="126">6M</button>
  <button data-days="252">1Y</button>
  <button data-days="0" aria-pressed="true">ALL</button>
  <span class="spacer"></span>
  <button id="reset-layout">RESET PANELS</button>
  <span id="s-sessions"></span>
</footer>

<script>
const LWC = window.LightweightCharts;
const CSS = getComputedStyle(document.documentElement);
const col = n => CSS.getPropertyValue(n).trim();

const msg = document.getElementById('msg');

if (!LWC) {
  msg.textContent =
    'Charting library failed to load — check your connection, or the ' +
    'unpkg.com CDN may be blocked on this network.';
}

let ROWS = [];
let candleSeries, upSeries, downSeries;
let charts = [];
let syncing = false;

/* ---------- data ---------- */

const num = v => {
  if (v === undefined || v === null || v === '') return null;
  const n = parseFloat(v);
  return Number.isFinite(n) ? n : null;
};

function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  const head = lines[0].split(',');
  return lines.slice(1).map(line => {
    const cells = line.split(',');
    const r = {};
    head.forEach((h, i) => r[h] = cells[i]);
    return {
      time: r.as_of,
      open: num(r.spy_open), high: num(r.spy_high),
      low: num(r.spy_low), close: num(r.spy_close),
      up: parseInt(r.up_count, 10) || 0,
      down: parseInt(r.down_count, 10) || 0,
      net: parseInt(r.net, 10) || 0,
    };
  }).filter(r => r.time).sort((a, b) => a.time.localeCompare(b.time));
}

/* ---------- chart construction ---------- */

// minimumWidth keeps every price scale the same width, which is what
// actually makes the three panes line up column for column.
function baseOptions(showTime) {
  return {
    autoSize: true,
    layout: {
      background: { type: 'solid', color: col('--pane') },
      textColor: col('--dim'),
      fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace',
      fontSize: 10,
    },
    grid: {
      vertLines: { color: col('--grid') },
      horzLines: { color: col('--grid') },
    },
    rightPriceScale: {
      borderColor: col('--edge'),
      minimumWidth: 68,
      scaleMargins: { top: 0.12, bottom: 0.08 },
    },
    timeScale: {
      borderColor: col('--edge'),
      visible: showTime,
      rightOffset: 2,
      barSpacing: 6,
    },
    crosshair: {
      mode: LWC.CrosshairMode.Normal,
      vertLine: { color: '#4a4a55', width: 1, style: 3, labelBackgroundColor: '#2a2a32' },
      horzLine: { color: '#4a4a55', width: 1, style: 3, labelBackgroundColor: '#2a2a32' },
    },
    handleScroll: true,
    handleScale: true,
  };
}

function build() {
  const spy = LWC.createChart(document.getElementById('h-spy'), baseOptions(false));
  const up = LWC.createChart(document.getElementById('h-up'), baseOptions(false));
  const down = LWC.createChart(document.getElementById('h-down'), baseOptions(true));
  charts = [spy, up, down];

  candleSeries = spy.addCandlestickSeries({
    upColor: col('--up'),
    downColor: col('--down'),
    borderUpColor: col('--up'),
    borderDownColor: col('--down'),
    wickUpColor: col('--up'),
    wickDownColor: col('--down'),
    priceLineVisible: false,
    lastValueVisible: true,
  });

  upSeries = up.addHistogramSeries({
    color: col('--up'),
    priceLineVisible: false,
    priceFormat: { type: 'volume', precision: 0, minMove: 1 },
  });

  downSeries = down.addHistogramSeries({
    color: col('--down'),
    priceLineVisible: false,
    priceFormat: { type: 'volume', precision: 0, minMove: 1 },
  });

  // pan/zoom one pane, all three follow
  charts.forEach(src => {
    src.timeScale().subscribeVisibleLogicalRangeChange(range => {
      if (syncing || !range) return;
      syncing = true;
      charts.forEach(t => {
        if (t !== src) t.timeScale().setVisibleLogicalRange(range);
      });
      syncing = false;
    });
  });

  // one crosshair across all three panes
  charts.forEach(src => {
    src.subscribeCrosshairMove(param => {
      if (syncing) return;
      syncing = true;
      if (!param.time) {
        charts.forEach(t => { if (t !== src) t.clearCrosshairPosition(); });
      } else {
        const row = ROWS.find(r => r.time === param.time);
        charts.forEach(t => {
          if (t === src) return;
          const s = t === charts[0] ? candleSeries
                  : t === charts[1] ? upSeries : downSeries;
          const v = t === charts[0] ? (row && row.close)
                  : t === charts[1] ? (row && row.up) : (row && row.down);
          if (v != null) t.setCrosshairPosition(v, param.time, s);
        });
        readout(row);
      }
      syncing = false;
    });
  });
}

/* ---------- header readout ---------- */

function readout(row) {
  if (!row) return;
  document.getElementById('s-date').textContent = row.time;
  document.getElementById('s-spy').textContent = row.close ?? '—';
  document.getElementById('s-up').textContent = row.up;
  document.getElementById('s-down').textContent = row.down;
  document.getElementById('s-net').textContent =
    (row.net > 0 ? '+' : '') + row.net;
}

/* ---------- load data into series ---------- */

function setData(rows) {
  const candles = rows
    .filter(r => r.open !== null && r.high !== null &&
                 r.low !== null && r.close !== null)
    .map(r => ({ time: r.time, open: r.open, high: r.high,
                 low: r.low, close: r.close }));

  candleSeries.setData(candles);
  upSeries.setData(rows.map(r => ({ time: r.time, value: r.up })));
  downSeries.setData(rows.map(r => ({ time: r.time, value: r.down })));

  readout(rows[rows.length - 1]);
  document.getElementById('s-sessions').textContent =
    rows.length + ' SESSIONS' +
    (candles.length ? '' : ' · NO OHLC — RE-RUN BACKFILL');
}

function applyRange(days) {
  const n = ROWS.length;
  const from = days > 0 ? Math.max(0, n - days) : 0;
  syncing = true;
  charts.forEach(c =>
    c.timeScale().setVisibleLogicalRange({ from, to: n - 1 }));
  syncing = false;
}

/* ---------- resizable panes ---------- */

const LAYOUT_KEY = 'sss-pane-flex';
const MIN_H = 60;
const DEFAULTS = { 'p-spy': 340, 'p-up': 150, 'p-down': 150 };

function saveLayout() {
  const out = {};
  Object.keys(DEFAULTS).forEach(id => {
    out[id] = document.getElementById(id).offsetHeight;
  });
  try { localStorage.setItem(LAYOUT_KEY, JSON.stringify(out)); } catch (e) {}
}

function loadLayout() {
  try {
    const saved = JSON.parse(localStorage.getItem(LAYOUT_KEY) || 'null');
    if (!saved) return;
    Object.entries(saved).forEach(([id, px]) => {
      const el = document.getElementById(id);
      if (el && px >= MIN_H) el.style.flexGrow = px;
    });
  } catch (e) {}
}

let drag = null;

document.addEventListener('pointerdown', e => {
  const grip = e.target.closest('.grip');
  if (!grip) return;
  const above = document.getElementById(grip.dataset.above);
  const below = document.getElementById(grip.dataset.below);
  drag = {
    grip, above, below, y: e.clientY,
    hAbove: above.offsetHeight, hBelow: below.offsetHeight,
  };
  grip.classList.add('active');
  grip.setPointerCapture(e.pointerId);
  document.body.classList.add('resizing');
});

document.addEventListener('pointermove', e => {
  if (!drag) return;
  let dy = e.clientY - drag.y;
  dy = Math.max(dy, MIN_H - drag.hAbove);
  dy = Math.min(dy, drag.hBelow - MIN_H);
  // flex-basis is 0, so grow values behave as pixel heights
  drag.above.style.flexGrow = drag.hAbove + dy;
  drag.below.style.flexGrow = drag.hBelow - dy;
});

document.addEventListener('pointerup', () => {
  if (!drag) return;
  drag.grip.classList.remove('active');
  document.body.classList.remove('resizing');
  drag = null;
  saveLayout();
});

document.getElementById('reset-layout').addEventListener('click', () => {
  Object.entries(DEFAULTS).forEach(([id, g]) => {
    document.getElementById(id).style.flexGrow = g;
  });
  try { localStorage.removeItem(LAYOUT_KEY); } catch (e) {}
});

document.getElementById('controls').addEventListener('click', e => {
  const btn = e.target.closest('button[data-days]');
  if (!btn) return;
  document.querySelectorAll('#controls button[data-days]')
    .forEach(b => b.setAttribute('aria-pressed', b === btn));
  applyRange(parseInt(btn.dataset.days, 10));
});

/* ---------- go ---------- */

if (LWC) {
  fetch('history.csv?t=' + Date.now())
    .then(r => {
      if (!r.ok) throw new Error('history.csv returned ' + r.status);
      return r.text();
    })
    .then(text => {
      ROWS = parseCSV(text);
      if (!ROWS.length) throw new Error('history.csv has no data rows yet');
      msg.hidden = true;
      document.getElementById('panes').hidden = false;
      document.getElementById('controls').hidden = false;
      loadLayout();
      build();
      setData(ROWS);
      applyRange(0);
    })
    .catch(err => {
      msg.textContent =
        'Could not load history.csv — ' + err.message +
        '. Make sure this page sits in the same folder as history.csv.';
    });
}
</script>
</body>
</html>
