name: Growth Screen

on:
  schedule:
    # Saturdays at 09:00 UTC, same morning slot as the breadth scan
    - cron: "0 9 * * 6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run growth screen
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python growth_scan.py

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add output/
          git diff --staged --quiet || git commit -m "growth screen $(date -u +%Y-%m-%d)"
          git push
